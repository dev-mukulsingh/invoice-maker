# ===================================================================
# Multi-Template Invoice Generator & Billing Management System
# ===================================================================
spring.application.name=invoice-maker
server.port=8080

# -------------------------------------------------------------------
# MariaDB / MySQL Database Configuration (Port 3306)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/invoicedb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Table Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Configuration for PDF and Template Rendering
# -------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# Logging Settings
# -------------------------------------------------------------------
logging.level.com.invoicemaker=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
